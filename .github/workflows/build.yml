name: Build ZoneFinder APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check Android manifest
        run: |
          echo "Checking manifest file..."
          cat -n app/src/main/AndroidManifest.xml
          echo "Checking XML syntax..."
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/AndroidManifest.xml'); print('Manifest XML syntax is valid')"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --info

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: ZoneFinder-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
